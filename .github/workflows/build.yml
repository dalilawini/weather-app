name: Build ESP8266 Arduino Project

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]        # v1.0.0, v1.1.0, ...
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Arduino CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | sh
          sudo mv bin/arduino-cli /usr/local/bin/

      - name: Configure Arduino CLI
        run: |
          arduino-cli config init
          arduino-cli core update-index

      - name: Install ESP8266 core
        run: |
          arduino-cli core update-index --additional-urls \
          http://arduino.esp8266.com/stable/package_esp8266com_index.json
          arduino-cli core install esp8266:esp8266 --additional-urls \
          http://arduino.esp8266.com/stable/package_esp8266com_index.json

      - name: Install libraries
        run: |
            arduino-cli lib update-index
            arduino-cli lib install "ArduinoJson"
            arduino-cli lib install "Adafruit SH110X"
        
            mkdir -p ~/Arduino/libraries
            git clone https://github.com/beegee-tokyo/DHTesp.git ~/Arduino/libraries/DHTesp
      - name: Compile project
        run: |
          arduino-cli compile --fqbn esp8266:esp8266:nodemcuv2 --build-property compiler.cpp.extra_flags="-Iapp -Idisplay -Iio -Isensors -Iwireless -Istorage" -v
      # Download from the Actions run page (every run, PRs included)
      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: weather-app-firmware
          path: build/weather-app.bin
          
      # Permanent public download link (only on push to main)
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Weather App ${{ github.ref_name }}
          files: build/weather-app.bin
          generate_release_notes: true
